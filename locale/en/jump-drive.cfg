JumpDrive-Mk1=Spatial displacement system. Maximum jump pulse duration: 10 seconds.
JumpDrive-Mk2=Improved spatial displacement system. Maximum jump pulse duration: 5 seconds.
JumpDrive-Mk3=Advanced spatial displacement system. Maximum jump pulse duration: 1 second.
JumpCharger=Dedicated capacitor for the Jump Drive. Stores 5 GJ and accepts up to 100 MW from the equipment grid.

